name: CI retry

# GitHub sometimes never hands a job to a hosted runner ("The job was not
# acquired by Runner of type hosted even after multiple attempts") and cancels
# it after ~15 min, failing the run although nothing in it broke. When every
# failed job is one of those (never got a runner), re-run the failed jobs,
# up to twice. Real failures are left alone.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
                   --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                         | "\(.runner_name // "" | length > 0) \(.name)"')
          echo "$jobs"
          if [ -z "$jobs" ] || grep -q '^true ' <<<"$jobs"; then
            echo "A job ran on a runner and failed: a real failure, not re-running."
            exit 0
          fi
          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
