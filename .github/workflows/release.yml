name: Release

# Pushing a v* tag builds the Windows zip that install.ps1 downloads and
# attaches it (with its .sha256) to that tag's GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        run: |
          make windows WIN_CFLAGS="-O2 -Werror"
          make dist-windows
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "topopaper $TAG" --generate-notes
          gh release upload "$TAG" dist/topopaper-windows-x64.zip dist/topopaper-windows-x64.zip.sha256 --clobber
